<div xmlns:th="http://www.thymeleaf.org" th:fragment="directories"
     class="p-2 text-sm bg-white text-black select-none">

  <ul id="directoryTree"
      class="space-y-1 max-h-[600px] overflow-auto border rounded p-2 bg-white"></ul>

  <!-- 디렉터리 전용 템플릿 -->
  <template id="dirItemTemplate">
    <li>
      <div class="flex items-center gap-1 select-none">
        <button class="toggle-btn text-gray-500 w-4 h-4 flex items-center justify-center"
                data-uid="" data-loaded="false" aria-label="toggle" title="toggle">
          ▶
        </button>
        <span class="icon text-gray-600">📁</span>
        <span class="text-sm text-gray-800 cursor-pointer dir-label" data-uid="">폴더명</span>
      </div>
      <ul class="pl-5 hidden" data-children-for=""></ul>
    </li>
  </template>

  <th:script th:replace="~{Storage/StorageScript :: script}" />

  <script th:inline="javascript">
    // 서버에서 내려준 선택 UID 및 부모 경로 (Root → ... → 현재 폴더)
    const initialSelectedUid = /*[[${selectedUid}]]*/ null;
    const initialParents     = /*[[${parents}]]*/ [];

    document.addEventListener("DOMContentLoaded", () => {
      initDirectoryTree();
    });

    /**
     * 초기 트리 로딩:
     * 1) 항상 Root(null)부터 로딩
     * 2) 서버에서 내려준 parents (root → ... → current)를 순서대로 펼침
     * 3) 마지막 노드는 파일 목록 로딩 + Breadcrumb 갱신
     */
    async function initDirectoryTree() {
      const tree = document.getElementById("directoryTree");
      if (!tree) return;

      // 1) 진짜 루트부터 로딩
      await loadDirectory(null, tree);

      // 2) 서버에서 부모 경로가 온 경우: root → ... → current
      if (Array.isArray(initialParents) && initialParents.length > 0) {
        for (let i = 0; i < initialParents.length; i++) {
          const p = initialParents[i];
          const uid = p && p.uid;
          if (!uid) continue;

          const label = tree.querySelector(`.dir-label[data-uid="${uid}"]`);
          if (!label) continue;

          const li  = label.closest("li");
          const btn = li && li.querySelector(".toggle-btn");

          // 해당 노드 펼치기 (자식 로딩 + 아이콘 변경)
          if (btn) {
            await toggleNode(btn);
          }

          // 마지막 요소 = 현재 디렉터리
          if (i === initialParents.length - 1) {
            loadFileList(uid);

            // Path.html 쪽 Breadcrumb 갱신 (서버 경로 그대로 전달)
            if (typeof window.updateBreadcrumbFromServer === "function") {
              window.updateBreadcrumbFromServer(initialParents);
            } else if (typeof window.updateBreadcrumbByUid === "function") {
              window.updateBreadcrumbByUid(uid);
            }

            // 가시 영역으로 스크롤 + 하이라이트
            label.scrollIntoView({ block: "nearest" });
            label.classList.add("ring-2", "ring-blue-400", "rounded-sm");
            setTimeout(() => label.classList.remove("ring-2", "ring-blue-400", "rounded-sm"), 800);
          }
        }
      } else if (initialSelectedUid) {
        // parents 가 없고 selectedUid만 있는 경우 fallback
        await selectDirectory(initialSelectedUid);
      }
    }

    // 디렉터리 트리 클릭 위임
    document.getElementById("directoryTree").addEventListener("click", async (e) => {
      const label = e.target.closest(".dir-label");
      if (label) {
        const uid = label.dataset.uid;
        console.log("디렉터리 라벨 클릭:", uid);

        const li  = label.closest("li");
        const btn = li.querySelector(".toggle-btn");
        if (btn) await toggleNode(btn);

        loadFileList(uid);

        // 동적 이동 시에는 Path.html이 DOM 기반으로 갱신
        if (typeof window.updateBreadcrumbByUid === "function") {
          window.updateBreadcrumbByUid(uid);
        }
        return;
      }

      const toggleBtn = e.target.closest(".toggle-btn");
      if (toggleBtn) {
        const uid = toggleBtn.dataset.uid;
        console.log("토글 버튼 클릭:", uid);
        await toggleNode(toggleBtn);

        loadFileList(uid);

        if (typeof window.updateBreadcrumbByUid === "function") {
          window.updateBreadcrumbByUid(uid);
        }
      }
    });

    async function toggleNode(toggleBtn) {
      const uid = toggleBtn.dataset.uid;
      const li  = toggleBtn.closest("li");
      const container = li.querySelector("ul");
      const icon = li.querySelector(".icon");

      // 브라우저 타이틀 변경
      const dirName = li.querySelector(".dir-label").textContent;
      document.title = "BurrowNest - " + dirName;

      const isClosed = toggleBtn.textContent.trim() === "▶";
      if (isClosed) {
        toggleBtn.textContent = "▼";
        if (icon) icon.textContent = "📂";
        if (toggleBtn.dataset.loaded !== "true") {
          await loadDirectory(uid, container);
          toggleBtn.dataset.loaded = "true";
        }
        container.classList.remove("hidden");
      } else {
        toggleBtn.textContent = "▶";
        if (icon) icon.textContent = "📁";
        container.classList.add("hidden");
      }
    }

    /**
     * 특정 uid의 폴더를 선택(클릭 시뮬레이션)
     * - 이미 렌더된 트리라면 toggleNode + loadFileList
     */
    async function selectDirectory(uid) {
      const tree = document.getElementById("directoryTree");
      if (!tree) return false;

      if (!tree.children.length) {
        await loadDirectory(null, tree);
      }

      const label = tree.querySelector(`.dir-label[data-uid="${CSS.escape(uid ?? "")}"]`);
      if (!label) return false;

      const li  = label.closest("li");
      const btn = li?.querySelector(".toggle-btn");

      if (btn) {
        await toggleNode(btn);
      }
      loadFileList(uid);

      if (typeof window.updateBreadcrumbByUid === "function") {
        window.updateBreadcrumbByUid(uid);
      }

      label.scrollIntoView({ block: "nearest" });
      label.classList.add("ring-2", "ring-blue-400", "rounded-sm");
      setTimeout(() => label.classList.remove("ring-2", "ring-blue-400", "rounded-sm"), 800);

      return true;
    }

    // 디렉터리 로딩 (디렉터리만 반환된다고 가정)
    async function loadDirectory(uid, container) {
      const template = document.getElementById("dirItemTemplate");
      try {
        const baseUrl = /*[[@{/Dir/PathList.json}]]*/ null;

        const params = new URLSearchParams({ uid: uid });
        const options = {
          method: "GET",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
        };

        const urlAddress = baseUrl + "?" + params.toString();
		
		const address = /*[[@{/Dir/Path.html}]]*/ null;
		history.pushState({}, "", address + "?uid=" + encodeURIComponent(uid));
		
        const response   = await apiRequest(urlAddress, options);
        const list       = await response.json();

        list.forEach(item => {
          const frag = template.content.cloneNode(true);

          const toggleBtn = frag.querySelector(".toggle-btn");
          const label     = frag.querySelector(".dir-label");
          const icon      = frag.querySelector(".icon");
          const ul        = frag.querySelector("ul");

          label.textContent = item.name;
          label.dataset.uid = item.uid;

          ul.dataset.childrenFor = item.uid;
          ul.classList.add("hidden");

          if (item.hasChild) {
            toggleBtn.dataset.uid    = item.uid;
            toggleBtn.dataset.loaded = "false";
            toggleBtn.textContent    = "▶";
            icon.textContent         = "📁";
          } else {
            toggleBtn.remove();
            icon.textContent = "📁";
          }

          container.appendChild(frag);
        });
      } catch (err) {
        console.error("디렉터리 로딩 오류:", err);
      }
    }
  </script>
</div>
