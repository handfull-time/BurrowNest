<div xmlns:th="http://www.thymeleaf.org" th:fragment="path"
     class="flex items-center justify-between bg-gray-50 px-4 py-2 text-sm">

  <!-- 현재 경로 -->
  <div class="pl-2 truncate text-gray-700">
    <div id="breadcrumb" class="flex items-center space-x-1"></div>
  </div>

  <!-- 검색 영역 (동작은 이후 구현) -->
  <div>
    <input type="text" placeholder="검색"
           class="border rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
    <button class="ml-2 px-2 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">검색</button>
  </div>

  <!-- 드롭다운 템플릿 -->
  <template id="DropDownTemplate">
    <div class="dropdown absolute bg-white border border-gray-300 rounded shadow z-50 hidden">
      <ul class="py-2 text-sm text-gray-700"></ul>
    </div>
  </template>

  <script>
    (function () {
      const breadcrumbEl = document.getElementById("breadcrumb");

      if (!breadcrumbEl) return;

      // ------- 헬퍼들 -------

      function getTreeRoot() {
        return document.getElementById("directoryTree");
      }

      function findLabelByUid(uid) {
        const tree = getTreeRoot();
        if (!tree || !uid) return null;
        return tree.querySelector(`.dir-label[data-uid="${CSS.escape(uid)}"]`);
      }

      // uid 기준으로 ROOT → ... → 현재 폴더까지 경로 구성
      function buildPath(uid) {
        const path = [];
        const tree = getTreeRoot();
        if (!tree || !uid) return path;

        let label = findLabelByUid(uid);
        if (!label) return path;

        while (label) {
          const li = label.closest("li");
          if (!li) break;

          path.unshift({
            uid: label.dataset.uid,
            name: label.textContent.trim(),
            labelEl: label,
            liEl: li
          });

          const parentUl = li.parentElement;
          if (!parentUl || !parentUl.dataset.childrenFor) break;

          const parentUid = parentUl.dataset.childrenFor;
          const parentLabel = findLabelByUid(parentUid);
          label = parentLabel;
        }

        return path;
      }

      // 해당 단계의 children UL 확보 (필요 시 loadDirectory 호출)
      async function ensureChildrenLoaded(segment) {
        const li = segment.liEl || segment.labelEl.closest("li");
        if (!li) return null;

        const childUl = li.querySelector("ul[data-children-for]");
        if (!childUl) return null;

        const toggleBtn = li.querySelector(".toggle-btn");
        if (toggleBtn && toggleBtn.dataset.loaded !== "true" && typeof loadDirectory === "function") {
          await loadDirectory(segment.uid, childUl);
          toggleBtn.dataset.loaded = "true";
        }

        return childUl;
      }

      function closeExistingDropdown() {
        document.querySelectorAll(".path-dropdown").forEach(d => d.remove());
      }

      // 화살표 클릭 시 하위 폴더 드롭다운
      async function openDropdownForSegment(segment, anchorEl) {
        closeExistingDropdown();

        const template = document.getElementById("DropDownTemplate");
        if (!template) return;

        const clone = template.content.cloneNode(true);
        const dropdown = clone.querySelector(".dropdown");
        if (!dropdown) return;
        dropdown.classList.add("path-dropdown");

        const ul = dropdown.querySelector("ul");
        const childUl = await ensureChildrenLoaded(segment);
        if (!childUl) return;

        const childLis = Array.from(childUl.children);

        childLis.forEach(li => {
          const lbl = li.querySelector(".dir-label");
          if (!lbl) return;

          const uid = lbl.dataset.uid;
          const name = lbl.textContent.trim();

          const liEl = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "block px-4 py-1 hover:bg-gray-100 w-full text-left text-xs";
          btn.textContent = name;

          if (uid === segment.nextUid) {
            btn.classList.add("font-semibold", "text-blue-600");
          }

          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            closeExistingDropdown();

            if (typeof window.selectDirectory === "function") {
              await window.selectDirectory(uid);
            } else if (typeof window.loadFileList === "function") {
              window.loadFileList(uid);
            }

            updateBreadcrumbByUid(uid);
          });

          liEl.appendChild(btn);
          ul.appendChild(liEl);
        });

        document.body.appendChild(dropdown);
        const rect = anchorEl.getBoundingClientRect();
        dropdown.style.position = "absolute";
        dropdown.style.left = `${rect.left + window.scrollX}px`;
        dropdown.style.top = `${rect.bottom + window.scrollY}px`;
        dropdown.classList.remove("hidden");

        const closeOnClick = (evt) => {
          if (!dropdown.contains(evt.target)) {
            closeExistingDropdown();
            document.removeEventListener("click", closeOnClick);
          }
        };
        // setTimeout으로 현재 클릭 이벤트 이후에 등록
        setTimeout(() => document.addEventListener("click", closeOnClick), 0);
      }

      // 실제 breadcrumb DOM 렌더
      function renderBreadcrumbForPath(path) {
        breadcrumbEl.innerHTML = "";

        if (!path.length) {
          const span = document.createElement("span");
          span.textContent = "/";
          span.className = "text-gray-800";
          breadcrumbEl.appendChild(span);
          return;
        }

        path.forEach((segment, idx) => {
          const container = document.createElement("div");
          container.className = "relative inline-flex items-center";

          // 경로 조각 버튼 (이름)
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "px-1 text-blue-700 hover:underline text-xs md:text-sm";
          btn.textContent = segment.name;
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            if (typeof window.selectDirectory === "function") {
              await window.selectDirectory(segment.uid);
            } else if (typeof window.loadFileList === "function") {
              window.loadFileList(segment.uid);
            }
            updateBreadcrumbByUid(segment.uid);
          });
          container.appendChild(btn);

          // 마지막이 아니면 화살표(▾) → 드롭다운
          if (idx < path.length - 1) {
            const arrow = document.createElement("button");
            arrow.type = "button";
            arrow.className = "mx-0.5 text-gray-500 hover:bg-gray-100 rounded px-0.5";
            arrow.textContent = "▾";
            arrow.addEventListener("click", (e) => {
              e.stopPropagation();
              openDropdownForSegment(
                {
                  uid: segment.uid,
                  labelEl: segment.labelEl,
                  liEl: segment.liEl,
                  nextUid: path[idx + 1].uid
                },
                arrow
              );
            });
            container.appendChild(arrow);
          }

          breadcrumbEl.appendChild(container);
        });
      }

      // 외부에서 호출할 수 있게 공개
      function updateBreadcrumbByUid(uid) {
        const path = buildPath(uid);
        renderBreadcrumbForPath(path);
      }
      window.updateBreadcrumbByUid = updateBreadcrumbByUid;

      // ------- Directory.html 과 연동 -------

      // 1) 디렉터리 트리에서 클릭 시 자동 갱신
      const tree = getTreeRoot();
      if (tree) {
        tree.addEventListener("click", (e) => {
          const label = e.target.closest(".dir-label");
          if (label && label.dataset.uid) {
            updateBreadcrumbByUid(label.dataset.uid);
            return;
          }
          const toggleBtn = e.target.closest(".toggle-btn");
          if (toggleBtn && toggleBtn.dataset.uid) {
            updateBreadcrumbByUid(toggleBtn.dataset.uid);
          }
        });
      }

      // 2) selectDirectory가 이미 정의되어 있으면 감싸서 호출 후 breadcrumb 갱신
      if (typeof window.selectDirectory === "function") {
        const originalSelectDirectory = window.selectDirectory;
        window.selectDirectory = async function (uid) {
          const result = await originalSelectDirectory(uid);
          if (uid != null) {
            updateBreadcrumbByUid(uid);
          }
          return result;
        };
      }

      // 3) 최초 진입 시 URL ?uid= 파라미터 기준으로 초기 breadcrumb 렌더
      try {
        const params = new URLSearchParams(window.location.search);
        const currentUid = params.get("uid");
        if (currentUid) {
          // 트리가 그려지는 시간 고려해 약간 딜레이
          setTimeout(() => updateBreadcrumbByUid(currentUid), 300);
        }
      } catch (e) {
        console.warn("breadcrumb init error:", e);
      }
    })();
  </script>
</div>
