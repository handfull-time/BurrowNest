<div xmlns:th="http://www.thymeleaf.org" 
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{Common/LayoutModal}"
    th:with="maxHeight='120'">
    
    <th:block layout:fragment="modalTitle">
        회원 상세
    </th:block>

	<th:block layout:fragment="modalContent">
	<form id="updateUserForm" th:object="${item}">
		<input type="hidden" th:field="*{userNo}">
        <table class="w-full border-collapse">
		    <tbody>
	            <!-- ID -->
	            <tr>
	                <td class="w-1/4 font-medium p-2"><label for="id">아이디</label></td>
	                <td class="w-3/4 p-2">
	                    <input type="text" readonly th:field="*{id}" required
	                    	class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" >
	                </td>
	            </tr>
	            <th:block th:replace="~{Auth/AuthPassword :: AuthPassword}"></th:block>
	            <tr>
		            <td class="font-medium p-2">별명</td>
		                <td class="p-2 flex items-center">
		                	<input type="text" th:field="*{nickname}" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" minlength="1" maxlength="20" required>
		                	<div class="relative ml-4">
	                			<script th:replace="~{Common/ProfileImg :: imageEle( userNo='0', userId='프로필이미지' )}"></script>
		                	</div>
		                </td>
		            </tr>
	
	            <th:block th:replace="~{Auth/AuthHint :: AuthHint}"></th:block>
	        </tbody>
	    </table>
    </form>
    </th:block>
    
    <th:block layout:fragment="modalButton">
    	<button id="saveButton" onclick="saveData(this)" class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 transition">
            저장
        </button>
        <button onclick="closePopup(this)" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition">
            취소
        </button>
    </th:block>
    
    
    <th:block layout:fragment="modalScript">
    
    	<script th:replace="~{Common/ProfileImg :: script}"></script>
    	
    	<script th:replace="~{Auth/AuthPassword :: script( func = 'btnStatus' )}"></script>
    	
    	<script type="text/javascript" th:src="@{/js/jsencrypt/jsencrypt.min.js}"></script>
    
	    <script th:inline="javascript">
		    function encryptPassword( value ) {
		    	
		    	if( value == null || value.trim() === '' ){
		    		return null;
		    	}
		    	
		        const encrypt = new JSEncrypt();
		        encrypt.setPublicKey(/*[[${unique.publicKey}]]*/ null);
	
		        return encrypt.encrypt(value);
		    }
		</script>
    	
		<script th:inline="javascript">
		
		document.addEventListener('DOMContentLoaded', () => {
			document.getElementById('myRainbow').removeAttribute('required');
			document.getElementById('mySeason').removeAttribute('required');
			document.getElementById('myNumber').removeAttribute('required');
        });
		

	    document.addEventListener('DOMContentLoaded', () => {
	    	buttonStatus( 'UserJoinBtn', false );
	    	document.getElementById("myRainbow").addEventListener("blur", comparePassword);
		    document.getElementById("mySeason").addEventListener("blur", comparePassword);
		    document.getElementById("myNumber").addEventListener("blur", comparePassword);
	    });
	    
	    function btnStatus(status){
	    	
	    	if( status ){
	    		
	    		const rainbow = document.getElementById("myRainbow").value;
		        const season = document.getElementById("mySeason").value;
		        const num = document.getElementById("myNumber").value;

		        status = rainbow.trim() !== "" && season.trim() !== "" && num.trim() !== "";
	    	}
	    	
	    	buttonStatus( 'UserJoinBtn', status );
	    }
	    
		 // 데이터 저장
        async function saveData(ele) {
			const imageData = await getProfileImage();
 	    	if (!imageData) {
 	    		showCustomAlert("이미지 처리 오류가 발생했습니다.");
 	    		return;
 	        }
 	    	
 	    	const loading = document.getElementById("loadingOverlay");
 	        if (loading) loading.classList.remove("hidden");
 	            
 	        const formData = new FormData();
 	        formData.append("id", /*[[${item.id}]]*/ null);
 	        formData.append("token", /*[[${unique.token}]]*/ null);
 	        formData.append("rsaId", /*[[${unique.rsaId}]]*/ null);
 	        formData.append("pw", encryptPassword( document.getElementById("password").value) );
 	        formData.append("nickname", document.getElementById("nickname").value);
 	        formData.append("myRainbow", document.getElementById("myRainbow").value);
 	        formData.append("mySeason", document.getElementById("mySeason").value);
 	        formData.append("myNumber", document.getElementById("myNumber").value);
 	        formData.append("profileImg", imageData);

 	        try {
 	            const response = await apiRequest(/*[[@{/User/UpdateUser.json}]]*/ null, {
 	                method: "POST",
 	                body: formData,
 	                credentials: "include"
 	            });
 	            
 	            if (loading) loading.classList.add("hidden");

 	           	if (response.ok) {
 	                const result = await response.json();
 	                console.log('저장 결과:', result);
 	                if( result.code == '0' ){
 	                	location.reload(); 
 	                }else{
 	                	showCustomAlert( '저장 실패 ' + result.code + ':' + result.message, function(){
 	                		closePopup(ele);
 	                	} );
 	                }
 	            } else {
 	            	console.error('저장 오류:', response.status);
 	            	showCustomAlert( '저장 오류:' + response.status , function(){
 	            		closePopup(ele);
 	            	} );
 	            }
 	        } catch (error) {
 	            console.error("Error:", error);
 	            showCustomAlert("서버 오류가 발생했습니다.");
 	        }
		 }
		</script>
    </th:block>
</div>
