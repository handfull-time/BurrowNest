<div xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{Common/LayoutModal}" th:with="maxHeight='120'">

	<th:block layout:fragment="modalTitle">
		회원 상세
	</th:block>

	<th:block layout:fragment="modalContent">
		<form id="updateUserForm" th:object="${item}">
			<input type="hidden" th:field="*{userNo}">
			<table class="w-full border-collapse">
				<tbody>
					<!-- ID -->
					<tr>
						<td class="w-1/4 font-medium p-2"><label for="id">아이디</label></td>
						<td class="w-3/4 p-2">
							<input type="text" readonly th:field="*{id}" required
								class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400">
						</td>
					</tr>
					<th:block th:replace="~{Auth/AuthPassword :: AuthPassword}"></th:block>
					<tr>
						<td class="font-medium p-2">별명</td>
						<td class="p-2 flex items-center">
							<input type="text" th:field="*{nickname}"
								class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-400" minlength="1"
								maxlength="20" required>
							<div class="relative ml-4">
								<script
									th:replace="~{Common/ProfileImg :: imageEle( userNo='0', userId='프로필이미지' )}"></script>
							</div>
						</td>
					</tr>

					<th:block th:replace="~{Auth/AuthHint :: AuthHint}"></th:block>
					<tr>
						<td class="font-medium p-2">Dropbox 상태</td>
						<td th:if="${item.connected}" class="p-2 flex items-center space-x-4">
							<span>✅ Dropbox 연결됨</span>
							<button type="button" 
								class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition"
								onclick="return unlinkDropbox(this);">
								Dropbox 해제
							</button>

						</td>
						<td th:if="${!item.connected}" class="p-2 flex items-center space-x-4">
							<span>❌ 미연결</span>
							<button type="button" 
								class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition"
								onclick="return connectDropbox(this);">
								Dropbox 연결
							</button>
						</td>
					</tr>
				</tbody>
			</table>
		</form>
	</th:block>

	<th:block layout:fragment="modalButton">
		<button id="saveButton" onclick="saveData(this)"
			class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 transition">
			저장
		</button>
		<button onclick="closePopup(this)"
			class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition">
			취소
		</button>
	</th:block>


	<th:block layout:fragment="modalScript">

		<script th:replace="~{Common/ProfileImg :: script}"></script>

		<script th:replace="~{Auth/AuthPassword :: script( func = 'btnStatus' )}"></script>

		<script type="text/javascript" th:src="@{/js/jsencrypt/jsencrypt.min.js}"></script>

		<script th:inline="javascript">
			function encryptPassword(value) {

				if (value == null || value.trim() === '') {
					return null;
				}

				const encrypt = new JSEncrypt();
				encrypt.setPublicKey(/*[[${unique.publicKey}]]*/ null);

				return encrypt.encrypt(value);
			}
		</script>

		<script th:inline="javascript">

			document.addEventListener('DOMContentLoaded', () => {
				document.getElementById('myRainbow').removeAttribute('required');
				document.getElementById('mySeason').removeAttribute('required');
				document.getElementById('myNumber').removeAttribute('required');
			});


			document.addEventListener('DOMContentLoaded', () => {
				buttonStatus('UserJoinBtn', false);
				document.getElementById("myRainbow").addEventListener("blur", comparePassword);
				document.getElementById("mySeason").addEventListener("blur", comparePassword);
				document.getElementById("myNumber").addEventListener("blur", comparePassword);
			});

			function btnStatus(status) {

				if (status) {

					const rainbow = document.getElementById("myRainbow").value;
					const season = document.getElementById("mySeason").value;
					const num = document.getElementById("myNumber").value;

					status = rainbow.trim() !== "" && season.trim() !== "" && num.trim() !== "";
				}

				buttonStatus('UserJoinBtn', status);
			}

			// 데이터 저장
			async function saveData(ele) {
				const imageData = await getProfileImage();
				if (!imageData) {
					showCustomAlert("이미지 처리 오류가 발생했습니다.");
					return;
				}

				const loading = document.getElementById("loadingOverlay");
				if (loading) loading.classList.remove("hidden");

				const formData = new FormData();
				formData.append("id", /*[[${item.id}]]*/ null);
				formData.append("token", /*[[${unique.token}]]*/ null);
				formData.append("rsaId", /*[[${unique.rsaId}]]*/ null);
				formData.append("pw", encryptPassword(document.getElementById("password").value));
				formData.append("nickname", document.getElementById("nickname").value);
				formData.append("myRainbow", document.getElementById("myRainbow").value);
				formData.append("mySeason", document.getElementById("mySeason").value);
				formData.append("myNumber", document.getElementById("myNumber").value);
				formData.append("profileImg", imageData);

				try {
					const response = await apiRequest(/*[[@{/User/UpdateUser.json}]]*/ null, {
						method: "POST",
						body: formData,
						credentials: "include"
					});

					if (loading) loading.classList.add("hidden");

					if (response.ok) {
						const result = await response.json();
						console.log('저장 결과:', result);
						if (result.code == '0') {
							location.reload();
						} else {
							showCustomAlert('저장 실패 ' + result.code + ':' + result.message, function () {
								closePopup(ele);
							});
						}
					} else {
						console.error('저장 오류:', response.status);
						showCustomAlert('저장 오류:' + response.status, function () {
							closePopup(ele);
						});
					}
				} catch (error) {
					console.error("Error:", error);
					showCustomAlert("서버 오류가 발생했습니다.");
				}
			}

			function connectDropbox(btn) {
				const id = /*[[${item.id}]]*/ null;

				// 현재 페이지로 돌아오기 위한 returnUrl (쿼리/해시 포함)
				const returnUrl = window.location.pathname + window.location.search + window.location.hash;

				// 팝업 시도용 URL (서버에서 state에 returnUrl/popup정보를 담아야 함)
				const url = `/*[[@{/Dropbox/Connect/${encodeURIComponent(id)}?popup=1&returnUrl=${encodeURIComponent(returnUrl)}]]*/`;

				// 팝업 시도(PC)
				const w = 520, h = 720;
				const left = Math.max(0, (window.screen.width - w) / 2);
				const top = Math.max(0, (window.screen.height - h) / 2);

				const popup = window.open(
					url,
					"dropbox_oauth",
					`width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`
				);

				// 팝업이 차단되거나 모바일이면 현재창으로 진행
				if (!popup || popup.closed || typeof popup.closed === "undefined") {
					window.location.href = url.replace("popup=1", "popup=0");
				}

				return false;
			}

			async function unlinkDropbox(btn) {
				const id = /*[[${item.id}]]*/ null;

				const ok = confirmP("Dropbox 연결을 해제할까요?");
				if( !ok ) return;
							
				try {
					const res = await fetch(`/Dropbox/Unlink/${encodeURIComponent(id)}`, {
						method: "POST",
						credentials: "include"
					});

					if (!res.ok) throw new Error("HTTP " + res.status);

					const data = await res.json(); // ReturnBasic

					// ReturnBasic 구조에 맞게 조정 가능
					// 예: data.success === true 같은 필드가 있으면 그걸로 판단
					// 여기서는 일단 ok면 화면 새로고침으로 단순 처리
					location.reload();

				} catch (e) {
					console.error("Unlink 실패", e);
					alert("해제에 실패했습니다. 잠시 후 다시 시도해 주세요.");
				}

				return false;
			}

			// ✅ 팝업 callback 결과 수신 (callback 페이지에서 postMessage 보내는 방식)
			window.addEventListener("message", (event) => {
				if (event.origin !== window.location.origin) return;
				if (event.data?.type !== "DROPBOX_OAUTH_DONE") return;

				if (event.data.success) {
					// 연결 성공 → 상태 갱신
					location.reload();
				} else {
					alert("Dropbox 연결 실패: " + (event.data.error || "unknown"));
				}
			});
		</script>
	</th:block>
</div>
